name: Alpine results update

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: Optional ISO date override (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: alpine-results-update
  cancel-in-progress: false

jobs:
  prepare-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: elo/python/alpine/polars
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Resolve run parameters
        id: parameters
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          as_of="${REQUESTED_AS_OF:-$(date -u +%F)}"
          if ! [[ "$as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid as_of date: $as_of" >&2
            exit 1
          fi
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          echo "output_root=$RUNNER_TEMP/alpine-results-update" >> "$GITHUB_OUTPUT"

      - name: Build isolated results candidate
        run: >-
          uv run --isolated --python 3.12
          --with-requirements requirements-startlist-replay.txt
          python alpine_results_update.py
          --schedule excel365/races.csv
          --men-chrono excel365/men_chrono.csv
          --ladies-chrono excel365/ladies_chrono.csv
          --aliases excel365/fis_identity_aliases.csv
          --as-of "${{ steps.parameters.outputs.as_of }}"
          --output-root "${{ steps.parameters.outputs.output_root }}"
          --allow-network

      - name: Read candidate status
        id: candidate
        run: |
          report="${{ steps.parameters.outputs.output_root }}/report.json"
          status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$report")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Promote candidate into review branch
        if: steps.candidate.outputs.status == 'candidate'
        run: |
          cp "${{ steps.parameters.outputs.output_root }}/promotion/men_chrono.csv" excel365/men_chrono.csv
          cp "${{ steps.parameters.outputs.output_root }}/promotion/ladies_chrono.csv" excel365/ladies_chrono.csv
          uv run --isolated --python 3.12 \
            --with-requirements requirements-startlist-replay.txt \
            python -m unittest discover -s . -p 'test_*.py' -v

      - name: Publish validated results to main
        if: steps.candidate.outputs.status == 'candidate'
        env:
          AS_OF: ${{ steps.parameters.outputs.as_of }}
          REPORT: ${{ steps.parameters.outputs.output_root }}/report.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add excel365/men_chrono.csv excel365/ladies_chrono.csv
          if git diff --cached --quiet; then
            echo "Candidate produced no accepted-history diff"
            exit 0
          fi
          races=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["acquired_race_count"])' "$REPORT")
          rows=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["acquired_result_rows"])' "$REPORT")
          git commit -m "Update Alpine results through $AS_OF"
          git push origin HEAD:main
          {
            echo "Published validated Alpine results through $AS_OF."
            echo "Acquired races: $races; replayed result rows: $rows."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-results-update-${{ steps.parameters.outputs.as_of }}-${{ github.run_id }}
          path: |
            ${{ steps.parameters.outputs.output_root }}/report.json
            ${{ steps.parameters.outputs.output_root }}/gap-report.json
            ${{ steps.parameters.outputs.output_root }}/acquisition/report.json
            ${{ steps.parameters.outputs.output_root }}/acquisition/results.csv
            ${{ steps.parameters.outputs.output_root }}/identity/report.json
            ${{ steps.parameters.outputs.output_root }}/identity/identity_map.csv
            ${{ steps.parameters.outputs.output_root }}/replay/report.json
            ${{ steps.parameters.outputs.output_root }}/promotion/report.json
          if-no-files-found: warn
          retention-days: 30
